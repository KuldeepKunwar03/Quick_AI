<svg width="168" height="43" viewBox="0 0 168 43" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- userSpaceOnUse so every puff shares one gradient and the overlaps leave no seams -->
    <linearGradient id="nimbusCloud" x1="4.5" y1="10.5" x2="33.5" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5044E5"/>
      <stop offset="1" stop-color="#9234EA"/>
    </linearGradient>
  </defs>

  <g fill="url(#nimbusCloud)">
    <circle cx="11" cy="24" r="6.5"/>
    <circle cx="19" cy="19.5" r="9"/>
    <circle cx="27.5" cy="24.5" r="6"/>
    <rect x="4.5" y="24" width="29" height="8" rx="4"/>
  </g>

  <text x="43" y="29"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="600" letter-spacing="-0.4">
    <tspan fill="#5044E5">nimbus</tspan><tspan fill="#9234EA">.ai</tspan>
  </text>
</svg>
